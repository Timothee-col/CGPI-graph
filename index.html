const nodes = [];
const edges = [];
const idMap = {};

const ANCHOR_FILL = { rockfi:'#7c3aed', external:'#0d9488' };
const ANCHOR_FILL_HOV = { rockfi:'#a78bfa', external:'#14b8a6' };
const ANCHOR_STROKE = { rockfi:'#a78bfa', external:'#5eead4' };

// Color logic for CGP nodes:
// - tier 2 (multi-2): gold
// - tier 3+ (multi-3+): red
// - tier 1: based on org + confiance
function cgpColor(c) {
  const tier = c.conn.length;
  if (tier >= 3) return '#f87171';
  if (tier === 2) return '#fbbf24';
  const inBoth = c.orgs.length > 1;
  if (inBoth) return c.confiance === 'Elevee' ? '#c084fc' : '#a78bfa';
  if (c.orgs[0] === 'cncgp')   return c.confiance === 'Elevee' ? '#34d399' : '#fb923c';
  if (c.orgs[0] === 'anacofi') return c.confiance === 'Elevee' ? '#ec4899' : '#f472b6';
  return '#34d399';
}

ANCHORS.forEach(r => {
  idMap[r.id] = nodes.length;
  nodes.push({ ...r, x:0, y:0, vx:0, vy:0, radius:24, mass:10 });
});

CGPS.forEach(c => {
  const tier = c.conn.length;
  let radius, mass;
  if (tier >= 3) { radius = 12; mass = 4; }
  else if (tier === 2) { radius = 10; mass = 3; }
  else { radius = 6; mass = 1; }
  idMap[c.id] = nodes.length;
  nodes.push({ ...c, type:'cgp', x:0, y:0, vx:0, vy:0, radius, mass, color: cgpColor(c), multi: tier > 1, tier });
});

CGPS.forEach(c => {
  const si = idMap[c.id];
  c.conn.forEach(rid => edges.push({ source: si, target: idMap[rid], multi: c.conn.length > 1 }));
});

const W = window.innerWidth, H = window.innerHeight;
const cx = W/2, cy = H/2;
const ANCHOR_RADIUS = Math.min(W, H) * 0.30;

ANCHORS.forEach(r => {
  const ni = idMap[r.id];
  nodes[ni].x = cx + Math.cos(r.angle) * ANCHOR_RADIUS;
  nodes[ni].y = cy + Math.sin(r.angle) * ANCHOR_RADIUS;
});

CGPS.forEach(c => {
  const ni = idMap[c.id];
  if (c.conn.length > 1) {
    let sx = 0, sy = 0;
    c.conn.forEach(rid => { sx += nodes[idMap[rid]].x; sy += nodes[idMap[rid]].y; });
    nodes[ni].x = sx / c.conn.length + (Math.random()-0.5)*40;
    nodes[ni].y = sy / c.conn.length + (Math.random()-0.5)*40;
  } else {
    const anchor = idMap[c.conn[0]];
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 220;
    nodes[ni].x = nodes[anchor].x + Math.cos(angle) * dist;
    nodes[ni].y = nodes[anchor].y + Math.sin(angle) * dist;
  }
});

let activeFilter = 'all';
let alpha = 1;
let dragging = null;
let hovering = null;
let panX = 0, panY = 0, zoom = 1;
let panStart = null;

function isVisible(node) {
  if (node.type === 'anchor') return true;
  if (activeFilter === 'all') return true;
  if (activeFilter === 'multi') return node.multi;
  if (activeFilter === 'cncgp') return node.orgs.includes('cncgp');
  if (activeFilter === 'anacofi') return node.orgs.includes('anacofi');
  return node.conn && node.conn.includes(activeFilter);
}

function simulate() {
  const dt = 0.3, repulsion = 1200, attraction = 0.008, restLength = 180, damping = 0.88, centerPull = 0.0003;
  const visibleSet = new Set();
  nodes.forEach((n, i) => { if (isVisible(n)) visibleSet.add(i); });

  const visArr = [...visibleSet];
  for (let a = 0; a < visArr.length; a++) {
    for (let b = a+1; b < visArr.length; b++) {
      const na = nodes[visArr[a]], nb = nodes[visArr[b]];
      let dx = nb.x - na.x, dy = nb.y - na.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) d2 = 1;
      const d = Math.sqrt(d2);
      const f = repulsion / d2;
      const fx = (dx/d)*f, fy = (dy/d)*f;
      na.vx -= fx/na.mass; na.vy -= fy/na.mass;
      nb.vx += fx/nb.mass; nb.vy += fy/nb.mass;
    }
  }

  edges.forEach(e => {
    if (!visibleSet.has(e.source) || !visibleSet.has(e.target)) return;
    const na = nodes[e.source], nb = nodes[e.target];
    let dx = nb.x - na.x, dy = nb.y - na.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = (d - restLength) * attraction;
    const fx = (dx/d)*f, fy = (dy/d)*f;
    na.vx += fx; na.vy += fy;
    nb.vx -= fx; nb.vy -= fy;
  });

  nodes.forEach((n,i) => {
    if (!visibleSet.has(i)) return;
    n.vx += (cx - n.x) * centerPull;
    n.vy += (cy - n.y) * centerPull;
  });

  ANCHORS.forEach(r => {
    const n = nodes[idMap[r.id]];
    const tx = cx + Math.cos(r.angle) * ANCHOR_RADIUS;
    const ty = cy + Math.sin(r.angle) * ANCHOR_RADIUS;
    n.vx += (tx - n.x) * 0.02;
    n.vy += (ty - n.y) * 0.02;
  });

  nodes.forEach((n,i) => {
    if (!visibleSet.has(i) || n === dragging) return;
    n.vx *= damping * alpha; n.vy *= damping * alpha;
    n.x += n.vx * dt; n.y += n.vy * dt;
  });

  alpha *= 0.998;
  if (alpha < 0.01) alpha = 0.01;
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let dpr = window.devicePixelRatio || 1;

function resize() {
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

function toWorld(sx, sy) {
  return [(sx - W/2*(1-zoom))/zoom - panX, (sy - H/2*(1-zoom))/zoom - panY];
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2*(1-zoom) + panX*zoom, H/2*(1-zoom) + panY*zoom);
  ctx.scale(zoom, zoom);

  const visibleSet = new Set();
  nodes.forEach((n, i) => { if (isVisible(n)) visibleSet.add(i); });

  nodes.forEach((n, i) => {
    if (n.type !== 'anchor' || !visibleSet.has(i)) return;
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 110);
    if (n.external) {
      grad.addColorStop(0, 'rgba(20,184,166,0.12)');
      grad.addColorStop(1, 'rgba(20,184,166,0)');
    } else {
      grad.addColorStop(0, 'rgba(167,139,250,0.10)');
      grad.addColorStop(1, 'rgba(167,139,250,0)');
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(n.x, n.y, 110, 0, Math.PI*2); ctx.fill();
  });

  edges.forEach(e => {
    if (!visibleSet.has(e.source) || !visibleSet.has(e.target)) return;
    const na = nodes[e.source], nb = nodes[e.target];
    const isHovered = hovering !== null && (e.source === hovering || e.target === hovering);
    ctx.beginPath(); ctx.moveTo(na.x, na.y); ctx.lineTo(nb.x, nb.y);
    const cgpNode = na.type === 'cgp' ? na : nb;
    if (cgpNode.tier >= 3) {
      ctx.strokeStyle = isHovered ? 'rgba(248,113,113,0.95)' : 'rgba(248,113,113,0.55)';
      ctx.lineWidth = isHovered ? 2.8 : 1.8;
    } else if (cgpNode.tier === 2) {
      ctx.strokeStyle = isHovered ? 'rgba(251,191,36,0.85)' : 'rgba(251,191,36,0.45)';
      ctx.lineWidth = isHovered ? 2.5 : 1.5;
    } else {
      const col = cgpNode.color;
      const a = isHovered ? 0.6 : 0.13;
      const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
      ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
      ctx.lineWidth = isHovered ? 1.5 : 0.6;
    }
    ctx.stroke();
  });

  nodes.forEach((n, i) => {
    if (!visibleSet.has(i)) return;
    const isHov = i === hovering;
    if (n.type === 'anchor') {
      const kind = n.external ? 'external' : 'rockfi';
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + (isHov ? 3 : 0), 0, Math.PI*2);
      ctx.fillStyle = isHov ? ANCHOR_FILL_HOV[kind] : ANCHOR_FILL[kind];
      ctx.fill();
      ctx.strokeStyle = ANCHOR_STROKE[kind];
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.font = '600 12px "IBM Plex Sans"';
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n.short, n.x, n.y);
    } else {
      const r = n.radius + (isHov ? 2 : 0);
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.fillStyle = isHov ? n.color : n.color + 'cc';
      ctx.fill();
      if (n.tier >= 3) { ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 2; ctx.stroke(); }
      else if (n.tier === 2) { ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 1.8; ctx.stroke(); }
      if (isHov || n.multi) {
        ctx.font = (n.tier >= 3 ? '600 12px' : (n.multi ? '600 11px' : '500 10px')) + ' "IBM Plex Sans"';
        ctx.fillStyle = n.tier >= 3 ? '#fecaca' : (n.multi ? '#fde68a' : '#e8e8f0');
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(n.name, n.x, n.y - r - 4);
      }
    }
  });

  ctx.restore();
}

function frame() { simulate(); draw(); requestAnimationFrame(frame); }
frame();

function getNodeAt(mx, my) {
  const [wx, wy] = toWorld(mx, my);
  let best = null, bestD = Infinity;
  nodes.forEach((n, i) => {
    if (!isVisible(n)) return;
    const dx = wx - n.x, dy = wy - n.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    const hitR = n.radius + 8;
    if (d < hitR && d < bestD) { best = i; bestD = d; }
  });
  return best;
}

const ANCHOR_LABEL = { damien:'Damien', pierre:'Pierre', olric:'Olric', sahira:'Sahira', leleu:'Leleu' };
const BASE_LABEL   = { cncgp:'CNCGP', anacofi:'Anacofi' };

canvas.addEventListener('mousemove', e => {
  const mx = e.clientX, my = e.clientY;
  if (dragging !== null) {
    const [wx, wy] = toWorld(mx, my);
    nodes[dragging].x = wx; nodes[dragging].y = wy;
    nodes[dragging].vx = 0; nodes[dragging].vy = 0;
    alpha = 0.3; return;
  }
  if (panStart) {
    panX += (mx - panStart.x) / zoom; panY += (my - panStart.y) / zoom;
    panStart = { x: mx, y: my }; return;
  }
  const idx = getNodeAt(mx, my);
  hovering = idx;
  canvas.style.cursor = idx !== null ? 'pointer' : 'grab';
  if (idx !== null) {
    const n = nodes[idx];
    let html = '<div class="tt-name">' + (n.name || n.short) + '</div>';
    if (n.type === 'cgp') {
      html += '<div class="tt-org">' + n.org + '</div>';
      html += '<div>';
      n.orgs.forEach(o => { html += '<span class="tt-base ' + o + '">' + BASE_LABEL[o] + '</span>'; });
      html += '</div>';
      html += '<div class="tt-segment">Confiance LinkedIn : ' + n.confiance + '</div>';
      const connLabel = n.conn.map(id => ANCHOR_LABEL[id]).join(' + ');
      html += '<div class="tt-conn">→ ' + connLabel + '</div>';
      if (n.tier >= 3) html += '<div style="color:#f87171;font-size:10px;margin-top:4px">★★★ Connecté à ' + n.tier + ' personnes</div>';
      else if (n.tier === 2) html += '<div style="color:#fbbf24;font-size:10px;margin-top:4px">★★ Connecté à 2 personnes</div>';
    } else {
      const count = CGPS.filter(c => c.conn.includes(n.id)).length;
      html += '<div class="tt-org">' + count + ' CGP croisés' + (n.external ? ' • externe à Rockfi' : '') + '</div>';
      html += '<div class="tt-segment">Total connexions LinkedIn : ' + n.totalConn + '</div>';
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (mx + 16) + 'px';
    tooltip.style.top = (my - 10) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mousedown', e => {
  const idx = getNodeAt(e.clientX, e.clientY);
  if (idx !== null) { dragging = idx; alpha = 0.5; }
  else { panStart = { x: e.clientX, y: e.clientY }; }
});
canvas.addEventListener('mouseup', () => { dragging = null; panStart = null; });
canvas.addEventListener('mouseleave', () => { dragging = null; panStart = null; tooltip.style.display = 'none'; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  zoom = Math.max(0.3, Math.min(3, zoom * factor));
}, { passive: false });

canvas.addEventListener('click', e => {
  const idx = getNodeAt(e.clientX, e.clientY);
  if (idx !== null) openCard(nodes[idx]);
});

const cardEl = document.getElementById('card');
const cardBody = document.getElementById('card-body');

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"\']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openCard(n) {
  cardEl.classList.toggle('external', !!(n.type === 'anchor' && n.external));
  let html = '';
  if (n.type === 'cgp') {
    html += '<div class="card-name">' + escapeHtml(n.name) + '</div>';
    if (n.org) html += '<div class="card-org">' + escapeHtml(n.org) + '</div>';
    html += '<div class="card-conn" style="margin-bottom:8px">';
    n.orgs.forEach(o => { html += '<span class="card-chip ' + o + '">' + escapeHtml(BASE_LABEL[o]) + '</span>'; });
    html += '</div>';
    if (n.tier >= 4) html += '<div class="card-tier t4">★★★★ Connecté à ' + n.tier + ' personnes</div>';
    else if (n.tier >= 3) html += '<div class="card-tier t3">★★★ Connecté à ' + n.tier + ' personnes</div>';
    else if (n.tier === 2) html += '<div class="card-tier t2">★★ Connecté à 2 personnes</div>';
    html += '<div class="card-row"><span class="card-label">Confiance LinkedIn</span><br>' + escapeHtml(n.confiance) + '</div>';
    html += '<div class="card-row"><span class="card-label">Connecté à</span><div class="card-conn">';
    n.conn.forEach(id => {
      const ext = id === 'leleu' ? ' external' : '';
      html += '<span class="card-chip' + ext + '">' + escapeHtml(ANCHOR_LABEL[id]) + '</span>';
    });
    html += '</div></div>';
    if (n.linkedin) {
      html += '<a class="card-link" href="' + escapeHtml(n.linkedin) + '" target="_blank" rel="noopener">↗ Ouvrir le profil LinkedIn</a>';
    }
  } else {
    html += '<div class="card-name">' + escapeHtml(n.name) + (n.external ? ' <span style="color:#5eead4;font-size:11px;font-weight:500">• externe</span>' : '') + '</div>';
    const cgpList = CGPS.filter(c => c.conn.includes(n.id));
    html += '<div class="card-org">' + cgpList.length + ' CGP croisés sur ' + n.totalConn + ' contacts LinkedIn</div>';
    const multi = cgpList.filter(c => c.conn.length > 1).length;
    const cn = cgpList.filter(c => c.orgs.includes('cncgp')).length;
    const an = cgpList.filter(c => c.orgs.includes('anacofi')).length;
    html += '<div class="card-row"><span class="card-label">Répartition</span><br>';
    html += '<span class="card-chip cncgp" style="margin-right:4px">CNCGP ' + cn + '</span>';
    html += '<span class="card-chip anacofi">Anacofi ' + an + '</span></div>';
    if (multi) html += '<div class="card-row"><span class="card-label">dont multi-connectés</span><br>' + multi + '</div>';
    html += '<div class="card-row" style="margin-top:10px"><span class="card-label">Liste des CGP</span></div>';
    html += '<div style="max-height:240px;overflow-y:auto;margin-top:6px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px">';
    cgpList.sort((a,b) => b.conn.length - a.conn.length || a.name.localeCompare(b.name)).forEach(c => {
      const tierMark = c.conn.length >= 3 ? '<span style="color:#f87171">●</span> ' : c.conn.length === 2 ? '<span style="color:#fbbf24">●</span> ' : '';
      const baseTag = c.orgs.map(o => '<span style="color:' + (o==='cncgp'?'#6ee7b7':'#f9a8d4') + ';font-size:9px;font-family:monospace">' + BASE_LABEL[o] + '</span>').join(' ');
      html += '<div style="font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04)">';
      html += tierMark + '<a href="' + escapeHtml(c.linkedin) + '" target="_blank" rel="noopener" style="color:#d4c8ff;text-decoration:none">' + escapeHtml(c.name) + '</a>';
      html += ' ' + baseTag;
      html += ' <span style="color:#6060a0;font-size:10px">— ' + escapeHtml(c.org) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  cardBody.innerHTML = html;
  cardEl.style.display = 'block';
}

function closeCard() { cardEl.style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

function setFilter(f, ev) {
  activeFilter = f;
  alpha = 1;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  ev.target.classList.add('active');
}
</script>
</body>
</html>
