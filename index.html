<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damien × Pierre × CNCGP — Croisement LinkedIn</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0e0e12;
    color: #b8b8c0;
    font-family: 'IBM Plex Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(18,18,24,0.95);
    border: 1px solid rgba(140,120,255,0.25);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.5;
    color: #c8c8d4;
    display: none;
    z-index: 100;
    max-width: 280px;
    backdrop-filter: blur(12px);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  #tooltip .tt-name { font-weight: 600; color: #e8e8f0; font-size: 13px; margin-bottom: 2px; }
  #tooltip .tt-org { color: #8888a0; font-size: 11px; }
  #tooltip .tt-segment { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #7c6cf0; margin-top: 4px; }
  #tooltip .tt-conn { margin-top: 6px; font-size: 11px; color: #a0a0b8; }

  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(14,14,18,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 11px;
    line-height: 2;
    backdrop-filter: blur(8px);
    z-index: 50;
  }
  #legend .leg-title { font-weight: 500; color: #e0e0e8; margin-bottom: 4px; font-size: 12px; }
  .leg-row { display: flex; align-items: center; gap: 8px; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .leg-line { width: 20px; height: 0; border-top: 1px solid; flex-shrink: 0; }

  #stats {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(14,14,18,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    line-height: 1.8;
    backdrop-filter: blur(8px);
    z-index: 50;
    font-family: 'IBM Plex Mono', monospace;
  }
  #stats .stat-val { color: #a78bfa; font-weight: 500; }
  #stats .stat-multi { color: #fbbf24; font-weight: 500; }
  #stats .stat-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    color: #6060a0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  #filters {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 50;
  }
  .fbtn {
    background: rgba(14,14,18,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 7px 14px;
    color: #8888a0;
    font-size: 11px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    text-align: left;
    min-width: 160px;
  }
  .fbtn:hover { border-color: rgba(140,120,255,0.3); color: #c0c0d0; }
  .fbtn.active { border-color: rgba(140,120,255,0.5); color: #d4c8ff; background: rgba(100,80,200,0.12); }
  .fbtn .fbtn-count { float: right; color: #6060a0; margin-left: 12px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="tooltip"></div>

<div id="stats">
  <div class="stat-title">Croisement CNCGP</div>
  <span class="stat-val" id="s-total">31</span> CGP CNCGP connectés<br>
  <span class="stat-multi" id="s-multi">2</span> communs aux deux<br>
  <span class="stat-val" id="s-edges">33</span> edges
</div>

<div id="legend">
  <div class="leg-title">Nodes</div>
  <div class="leg-row"><div class="leg-dot" style="background:#a78bfa;width:12px;height:12px"></div> Damien / Pierre</div>
  <div class="leg-row"><div class="leg-dot" style="background:#34d399"></div> CGP — confiance Élevée</div>
  <div class="leg-row"><div class="leg-dot" style="background:#fb923c"></div> CGP — confiance Moyenne</div>
  <div class="leg-row"><div class="leg-dot" style="background:#fbbf24;border:1px solid #fbbf24"></div> Connecté aux deux</div>
  <div style="margin-top:6px" class="leg-title">Edges</div>
  <div class="leg-row"><div class="leg-line" style="border-color:rgba(167,139,250,0.5)"></div> Connection unique</div>
  <div class="leg-row"><div class="leg-line" style="border-color:#fbbf24;border-width:2px"></div> Multi-connecté</div>
</div>

<div id="filters">
  <button class="fbtn active" onclick="setFilter('all')">All<span class="fbtn-count" id="cnt-all">31</span></button>
  <button class="fbtn" onclick="setFilter('damien')">Damien<span class="fbtn-count" id="cnt-damien">12</span></button>
  <button class="fbtn" onclick="setFilter('pierre')">Pierre<span class="fbtn-count" id="cnt-pierre">21</span></button>
  <button class="fbtn" onclick="setFilter('multi')">Communs<span class="fbtn-count" id="cnt-multi">2</span></button>
</div>

<script>
const ANCHORS = [
  { id:'damien', name:'Damien', short:'Damien', type:'anchor', totalConn: 426 },
  { id:'pierre', name:'Pierre Marin', short:'Pierre', type:'anchor', totalConn: 788 },
];

const CGPS = [
  { id:'c0', name:'Stephan CLERJAUD', org:'EQUITRI', cabCount:1, linkedin:'https://fr.linkedin.com/in/stephanclerjaud', confiance:'Elevee', conn:['damien','pierre'] },
  { id:'c1', name:'Benoist LOMBARD', org:'LAPLACE', cabCount:1, linkedin:'https://fr.linkedin.com/in/benoist-lombard-451110', confiance:'Elevee', conn:['damien','pierre'] },
  { id:'c2', name:'Edouard BINET', org:'PEETERS PATRIMOINE', cabCount:1, linkedin:'https://www.linkedin.com/in/edouardbinet/', confiance:'Elevee', conn:['damien'] },
  { id:'c3', name:'Olivier BONTOUX', org:'MYWAY FAMILY OFFICE', cabCount:1, linkedin:'https://fr.linkedin.com/in/olivier-bontoux-00a6714', confiance:'Elevee', conn:['pierre'] },
  { id:'c4', name:'Jean Marc BROUILLARD', org:'NEWBEES SOLUTIONS (+2 cabinets)', cabCount:3, linkedin:'https://fr.linkedin.com/in/jean-marc-brouillard-8570858', confiance:'Elevee', conn:['damien'] },
  { id:'c5', name:'Nicolas COMMEROT', org:'ALTITUDE INVESTMENTS SOLUTIONS', cabCount:1, linkedin:'https://fr.linkedin.com/in/nicolas-commerot', confiance:'Elevee', conn:['pierre'] },
  { id:'c6', name:'Yves CONAN', org:'IRBIS SOLUTIONS', cabCount:1, linkedin:'https://fr.linkedin.com/in/yves-conan-8476591', confiance:'Elevee', conn:['pierre'] },
  { id:'c7', name:'Eugène CONSTANT', org:'AMBRE GESTION DE PATRIMOINE', cabCount:1, linkedin:'https://www.linkedin.com/in/eugeneconstantgestionpatrimoine/', confiance:'Elevee', conn:['pierre'] },
  { id:'c8', name:'Vincent CRUGEON', org:'FRANCE FINANCE CONSULTING', cabCount:1, linkedin:'https://fr.linkedin.com/in/vincent-crugeon-58b08b2', confiance:'Elevee', conn:['pierre'] },
  { id:'c9', name:'Alexandre DE SAGAZAN', org:'ARGUIN CONSEIL', cabCount:1, linkedin:'https://fr.linkedin.com/in/alexandre-de-sagazan-2bb9012', confiance:'Moyenne', conn:['pierre'] },
  { id:'c10', name:'Maxime DURAND', org:'AGAPE PATRIMOINE', cabCount:1, linkedin:'https://fr.linkedin.com/in/maxime-durand-agape-patrimoine', confiance:'Elevee', conn:['damien'] },
  { id:'c11', name:'John ELALOUF', org:'MONALIZA', cabCount:1, linkedin:'https://fr.linkedin.com/in/john-elalouf-6124a84', confiance:'Elevee', conn:['pierre'] },
  { id:'c12', name:'Guillaume FALLER', org:'GF PATRIMOINE', cabCount:1, linkedin:'https://fr.linkedin.com/in/guillaume-faller-8905552', confiance:'Elevee', conn:['pierre'] },
  { id:'c13', name:'Charlotte FLINOIS', org:'LBI PATRIMOINE', cabCount:1, linkedin:'https://fr.linkedin.com/in/charlotte-flinois-759b822/en', confiance:'Elevee', conn:['pierre'] },
  { id:'c14', name:'Souleymane-Jean GALADIMA', org:'SAPIANS', cabCount:1, linkedin:'https://fr.linkedin.com/in/souleymane-jean-galadima', confiance:'Elevee', conn:['pierre'] },
  { id:'c15', name:'Sandrine GENET', org:'CARAT CAPITAL', cabCount:1, linkedin:'https://fr.linkedin.com/in/sandrine-genet', confiance:'Elevee', conn:['pierre'] },
  { id:'c16', name:'Jérôme GLODAS', org:'ZALPHA', cabCount:1, linkedin:'https://fr.linkedin.com/in/jerome-glodas-9a83212a', confiance:'Elevee', conn:['damien'] },
  { id:'c17', name:'Amaury GOSSÉ', org:'LA MUETTE PATRIMOINE', cabCount:1, linkedin:'https://fr.linkedin.com/in/amaury-goss%C3%A9-56753b1', confiance:'Elevee', conn:['pierre'] },
  { id:'c18', name:'Sylvain LEFEVRE', org:'SYLVAIN LEFEVRE FINANCE', cabCount:1, linkedin:'https://www.linkedin.com/in/lef%C3%A8vre-sylvain-a363602a2/', confiance:'Moyenne', conn:['damien'] },
  { id:'c19', name:'Philippe MATTER', org:'ALTERNATIVE PATRIMONIALE', cabCount:1, linkedin:'https://www.linkedin.com/in/philippematter/', confiance:'Elevee', conn:['damien'] },
  { id:'c20', name:'Olivier MAURO', org:'ACTEA PATRIMOINE', cabCount:1, linkedin:'https://fr.linkedin.com/in/olivier-mauro-318b781', confiance:'Moyenne', conn:['pierre'] },
  { id:'c21', name:'Marianne NAVARRE', org:'MARIANNE NAVARRE CONSEIL', cabCount:1, linkedin:'https://www.linkedin.com/in/marianne-navarre-2561a32/', confiance:'Elevee', conn:['pierre'] },
  { id:'c22', name:'Aline PEREZ', org:'PASSION FINANCES', cabCount:1, linkedin:'https://www.linkedin.com/in/aperezcgp/', confiance:'Elevee', conn:['damien'] },
  { id:'c23', name:'Arnaud PERRIER', org:'INKIPIT FINANCE', cabCount:1, linkedin:'https://www.linkedin.com/in/arnaud-perrier-3086533/', confiance:'Elevee', conn:['pierre'] },
  { id:'c24', name:'Séverine PIOT-DEVAL', org:'TANIT', cabCount:1, linkedin:'https://fr.linkedin.com/in/severine-piot-deval', confiance:'Moyenne', conn:['pierre'] },
  { id:'c25', name:'Romain RENAULT', org:'RENAULT GESTION PRIVEE', cabCount:1, linkedin:'https://www.linkedin.com/in/romainrenault/', confiance:'Moyenne', conn:['damien'] },
  { id:'c26', name:'Cyrille RESTIER', org:'STRATEGINVEST', cabCount:1, linkedin:'https://fr.linkedin.com/in/cyrille-restier-6100aa23', confiance:'Moyenne', conn:['damien'] },
  { id:'c27', name:'Olivier RIEU', org:'KIMPA', cabCount:1, linkedin:'https://www.linkedin.com/in/olivierrieu/', confiance:'Elevee', conn:['pierre'] },
  { id:'c28', name:'Fred VIANAS', org:'UFIFRANCE PATRIMOINE', cabCount:1, linkedin:'https://fr.linkedin.com/in/fredvianas', confiance:'Elevee', conn:['pierre'] },
  { id:'c29', name:'Malcolm VINCENT', org:'BC FINANCES (+14 cabinets)', cabCount:15, linkedin:'https://fr.linkedin.com/in/malcolm-vincent-astoria', confiance:'Elevee', conn:['pierre'] },
  { id:'c30', name:'Bruno ZARAYA', org:'TREE FAMILY', cabCount:1, linkedin:'https://fr.linkedin.com/in/bruno-zaraya-511b4b2b', confiance:'Elevee', conn:['damien'] },
];

// Build nodes & edges
const nodes = [];
const edges = [];
const idMap = {};

ANCHORS.forEach((r,i) => {
  const n = { ...r, x:0, y:0, vx:0, vy:0, radius:26, mass:10 };
  idMap[r.id] = nodes.length;
  nodes.push(n);
});

const confColor = {
  'Elevee': '#34d399',
  'Moyenne': '#fb923c',
};

CGPS.forEach(c => {
  const multi = c.conn.length > 1;
  const n = {
    ...c, type:'cgp', x:0, y:0, vx:0, vy:0,
    radius: multi ? 10 : 6,
    mass: multi ? 3 : 1,
    color: multi ? '#fbbf24' : (confColor[c.confiance] || '#34d399'),
    multi,
  };
  idMap[c.id] = nodes.length;
  nodes.push(n);
});

CGPS.forEach(c => {
  const si = idMap[c.id];
  c.conn.forEach(rid => {
    edges.push({ source: si, target: idMap[rid], multi: c.conn.length > 1 });
  });
});

// Init layout
const W = window.innerWidth, H = window.innerHeight;
const cx = W/2, cy = H/2;

// Place anchors on a horizontal axis
nodes[idMap['damien']].x = cx - 220;
nodes[idMap['damien']].y = cy;
nodes[idMap['pierre']].x = cx + 220;
nodes[idMap['pierre']].y = cy;

CGPS.forEach(c => {
  const ni = idMap[c.id];
  if (c.conn.length > 1) {
    nodes[ni].x = cx + (Math.random()-0.5)*60;
    nodes[ni].y = cy + (Math.random()-0.5)*60;
  } else {
    const anchor = idMap[c.conn[0]];
    const angle = Math.random() * Math.PI * 2;
    const dist = 140 + Math.random() * 220;
    nodes[ni].x = nodes[anchor].x + Math.cos(angle) * dist;
    nodes[ni].y = nodes[anchor].y + Math.sin(angle) * dist;
  }
});

// Sim state
let activeFilter = 'all';
let alpha = 1;
let dragging = null;
let hovering = null;
let panX = 0, panY = 0, zoom = 1;
let panStart = null;

function isVisible(node) {
  if (node.type === 'anchor') return true;
  if (activeFilter === 'all') return true;
  if (activeFilter === 'multi') return node.multi;
  return node.conn && node.conn.includes(activeFilter);
}

function simulate() {
  const dt = 0.3;
  const repulsion = 1000;
  const attraction = 0.008;
  const restLength = 180;
  const damping = 0.88;
  const centerPull = 0.0003;

  const visibleSet = new Set();
  nodes.forEach((n, i) => { if (isVisible(n)) visibleSet.add(i); });

  const visArr = [...visibleSet];
  for (let a = 0; a < visArr.length; a++) {
    for (let b = a+1; b < visArr.length; b++) {
      const na = nodes[visArr[a]], nb = nodes[visArr[b]];
      let dx = nb.x - na.x, dy = nb.y - na.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) d2 = 1;
      const d = Math.sqrt(d2);
      const f = repulsion / d2;
      const fx = (dx/d)*f, fy = (dy/d)*f;
      na.vx -= fx/na.mass; na.vy -= fy/na.mass;
      nb.vx += fx/nb.mass; nb.vy += fy/nb.mass;
    }
  }

  edges.forEach(e => {
    if (!visibleSet.has(e.source) || !visibleSet.has(e.target)) return;
    const na = nodes[e.source], nb = nodes[e.target];
    let dx = nb.x - na.x, dy = nb.y - na.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = (d - restLength) * attraction;
    const fx = (dx/d)*f, fy = (dy/d)*f;
    na.vx += fx; na.vy += fy;
    nb.vx -= fx; nb.vy -= fy;
  });

  nodes.forEach((n,i) => {
    if (!visibleSet.has(i)) return;
    n.vx += (cx - n.x) * centerPull;
    n.vy += (cy - n.y) * centerPull;
  });

  nodes.forEach((n,i) => {
    if (!visibleSet.has(i) || n === dragging) return;
    n.vx *= damping * alpha;
    n.vy *= damping * alpha;
    n.x += n.vx * dt;
    n.y += n.vy * dt;
  });

  alpha *= 0.998;
  if (alpha < 0.01) alpha = 0.01;
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let dpr = window.devicePixelRatio || 1;

function resize() {
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

function toWorld(sx, sy) {
  return [(sx - W/2*(1-zoom))/zoom - panX, (sy - H/2*(1-zoom))/zoom - panY];
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2*(1-zoom) + panX*zoom, H/2*(1-zoom) + panY*zoom);
  ctx.scale(zoom, zoom);

  const visibleSet = new Set();
  nodes.forEach((n, i) => { if (isVisible(n)) visibleSet.add(i); });

  // Glow behind anchors
  nodes.forEach((n, i) => {
    if (n.type !== 'anchor' || !visibleSet.has(i)) return;
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 100);
    grad.addColorStop(0, 'rgba(167,139,250,0.10)');
    grad.addColorStop(1, 'rgba(167,139,250,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 100, 0, Math.PI*2);
    ctx.fill();
  });

  // Edges
  edges.forEach(e => {
    if (!visibleSet.has(e.source) || !visibleSet.has(e.target)) return;
    const na = nodes[e.source], nb = nodes[e.target];
    const isHovered = hovering !== null && (e.source === hovering || e.target === hovering);

    ctx.beginPath();
    ctx.moveTo(na.x, na.y);
    ctx.lineTo(nb.x, nb.y);

    if (e.multi) {
      ctx.strokeStyle = isHovered ? 'rgba(251,191,36,0.85)' : 'rgba(251,191,36,0.45)';
      ctx.lineWidth = isHovered ? 2.5 : 1.6;
    } else {
      const cgpNode = na.type === 'cgp' ? na : nb;
      const col = cgpNode.color;
      const a = isHovered ? 0.6 : 0.14;
      const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
      ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
      ctx.lineWidth = isHovered ? 1.5 : 0.7;
    }
    ctx.stroke();
  });

  // Nodes
  nodes.forEach((n, i) => {
    if (!visibleSet.has(i)) return;
    const isHov = i === hovering;

    if (n.type === 'anchor') {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + (isHov ? 3 : 0), 0, Math.PI*2);
      ctx.fillStyle = isHov ? '#a78bfa' : '#7c3aed';
      ctx.fill();
      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.font = '600 13px "IBM Plex Sans"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.short, n.x, n.y);
    } else {
      const r = n.radius + (isHov ? 2 : 0);
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.fillStyle = isHov ? n.color : n.color + 'cc';
      ctx.fill();

      if (n.multi) {
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }

      if (isHov || n.multi) {
        ctx.font = (n.multi ? '600 11px' : '500 10px') + ' "IBM Plex Sans"';
        ctx.fillStyle = n.multi ? '#fde68a' : '#e8e8f0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(n.name, n.x, n.y - r - 4);
      }
    }
  });

  ctx.restore();
}

function frame() {
  simulate();
  draw();
  requestAnimationFrame(frame);
}
frame();

function getNodeAt(mx, my) {
  const [wx, wy] = toWorld(mx, my);
  let best = null, bestD = Infinity;
  nodes.forEach((n, i) => {
    if (!isVisible(n)) return;
    const dx = wx - n.x, dy = wy - n.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    const hitR = n.radius + 8;
    if (d < hitR && d < bestD) { best = i; bestD = d; }
  });
  return best;
}

canvas.addEventListener('mousemove', e => {
  const mx = e.clientX, my = e.clientY;

  if (dragging !== null) {
    const [wx, wy] = toWorld(mx, my);
    nodes[dragging].x = wx;
    nodes[dragging].y = wy;
    nodes[dragging].vx = 0;
    nodes[dragging].vy = 0;
    alpha = 0.3;
    return;
  }

  if (panStart) {
    panX += (mx - panStart.x) / zoom;
    panY += (my - panStart.y) / zoom;
    panStart = { x: mx, y: my };
    return;
  }

  const idx = getNodeAt(mx, my);
  hovering = idx;
  canvas.style.cursor = idx !== null ? 'pointer' : 'grab';

  if (idx !== null) {
    const n = nodes[idx];
    let html = '<div class="tt-name">' + (n.name || n.short) + '</div>';
    if (n.type === 'cgp') {
      const orgLabel = n.cabCount > 1 ? n.org : n.org;
      html += '<div class="tt-org">' + orgLabel + '</div>';
      html += '<div class="tt-segment">Confiance LinkedIn : ' + n.confiance + '</div>';
      const connLabel = n.conn.map(id => id === 'damien' ? 'Damien' : 'Pierre').join(' + ');
      html += '<div class="tt-conn">→ Connecté à : ' + connLabel + '</div>';
      if (n.multi) html += '<div style="color:#fbbf24;font-size:10px;margin-top:4px">★ Connecté aux deux</div>';
    } else {
      const count = CGPS.filter(c => c.conn.includes(n.id)).length;
      html += '<div class="tt-org">' + count + ' CGP CNCGP croisés</div>';
      html += '<div class="tt-segment">Total connexions LinkedIn : ' + n.totalConn + '</div>';
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (mx + 16) + 'px';
    tooltip.style.top = (my - 10) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mousedown', e => {
  const idx = getNodeAt(e.clientX, e.clientY);
  if (idx !== null) {
    dragging = idx;
    alpha = 0.5;
  } else {
    panStart = { x: e.clientX, y: e.clientY };
  }
});

canvas.addEventListener('mouseup', () => { dragging = null; panStart = null; });
canvas.addEventListener('mouseleave', () => { dragging = null; panStart = null; tooltip.style.display = 'none'; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  zoom = Math.max(0.3, Math.min(3, zoom * factor));
}, { passive: false });

canvas.addEventListener('click', e => {
  const idx = getNodeAt(e.clientX, e.clientY);
  if (idx !== null) {
    const n = nodes[idx];
    if (n.linkedin) window.open(n.linkedin, '_blank');
  }
});

function setFilter(f) {
  activeFilter = f;
  alpha = 1;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
</script>
</body>
</html>
