<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockfi × CGP — LinkedIn connections</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0e0e12;
    color: #b8b8c0;
    font-family: 'IBM Plex Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(18,18,24,0.95);
    border: 1px solid rgba(140,120,255,0.25);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.5;
    color: #c8c8d4;
    display: none;
    z-index: 100;
    max-width: 260px;
    backdrop-filter: blur(12px);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  #tooltip .tt-name { font-weight: 600; color: #e8e8f0; font-size: 13px; margin-bottom: 2px; }
  #tooltip .tt-org { color: #8888a0; font-size: 11px; }
  #tooltip .tt-segment { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #7c6cf0; margin-top: 4px; }
  #tooltip .tt-conn { margin-top: 6px; font-size: 11px; color: #a0a0b8; }

  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(14,14,18,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 11px;
    line-height: 2;
    backdrop-filter: blur(8px);
    z-index: 50;
  }
  #legend .leg-title { font-weight: 500; color: #e0e0e8; margin-bottom: 4px; font-size: 12px; }
  .leg-row { display: flex; align-items: center; gap: 8px; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .leg-line { width: 20px; height: 0; border-top: 1px solid; flex-shrink: 0; }

  #stats {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(14,14,18,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    line-height: 1.8;
    backdrop-filter: blur(8px);
    z-index: 50;
    font-family: 'IBM Plex Mono', monospace;
  }
  #stats .stat-val { color: #a78bfa; font-weight: 500; }

  #filters {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 50;
  }
  .fbtn {
    background: rgba(14,14,18,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 7px 14px;
    color: #8888a0;
    font-size: 11px;
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    text-align: left;
  }
  .fbtn:hover { border-color: rgba(140,120,255,0.3); color: #c0c0d0; }
  .fbtn.active { border-color: rgba(140,120,255,0.5); color: #d4c8ff; background: rgba(100,80,200,0.12); }
  .fbtn .fbtn-count { float: right; color: #6060a0; margin-left: 12px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="tooltip"></div>

<div id="stats">
  <span class="stat-val">38</span> CGPs connectés<br>
  <span class="stat-val">3</span> multi-connectés<br>
  <span class="stat-val">41</span> edges
</div>

<div id="legend">
  <div class="leg-title">Nodes</div>
  <div class="leg-row"><div class="leg-dot" style="background:#a78bfa;width:12px;height:12px"></div> Rockfi team</div>
  <div class="leg-row"><div class="leg-dot" style="background:#34d399"></div> Associé unique</div>
  <div class="leg-row"><div class="leg-dot" style="background:#fb923c"></div> New Gen CGP</div>
  <div class="leg-row"><div class="leg-dot" style="background:#60a5fa"></div> Jeune en croissance</div>
  <div style="margin-top:6px" class="leg-title">Edges</div>
  <div class="leg-row"><div class="leg-line" style="border-color:rgba(167,139,250,0.5)"></div> Single connection</div>
  <div class="leg-row"><div class="leg-line" style="border-color:#fbbf24;border-width:2px"></div> Multi-connected</div>
</div>

<div id="filters">
  <button class="fbtn active" onclick="setFilter('all')">All<span class="fbtn-count">38</span></button>
  <button class="fbtn" onclick="setFilter('Sébastien Leleu')">S. Leleu<span class="fbtn-count">26</span></button>
  <button class="fbtn" onclick="setFilter('Olric')">Olric<span class="fbtn-count">7</span></button>
  <button class="fbtn" onclick="setFilter('Sahirah')">Sahirah<span class="fbtn-count">5</span></button>
  <button class="fbtn" onclick="setFilter('Marie')">Marie<span class="fbtn-count">3</span></button>
</div>

<script>
const ROCKFI = [
  { id:'r0', name:'Sébastien Leleu', short:'S. Leleu', type:'rockfi' },
  { id:'r1', name:'Olric', short:'Olric', type:'rockfi' },
  { id:'r2', name:'Sahirah', short:'Sahirah', type:'rockfi' },
  { id:'r3', name:'Marie', short:'Marie', type:'rockfi' },
];

const CGPS = [
  { id:'c0', name:'Hubert GIRONDEL', org:'Initial Family Office', segment:'Associé unique', conn:['r3','r1'] },
  { id:'c1', name:'Johan DIDOUCHE', org:'J.A.M Conseil', segment:'Associé unique', conn:['r1','r0'] },
  { id:'c2', name:'Nadim TAKCHI', org:'Openstone', segment:'New Gen CGP', conn:['r3','r1'] },
  { id:'c3', name:'Anthony CROS', org:'Cros Investing', segment:'Associé unique', conn:['r0'] },
  { id:'c4', name:'Antoine DELON', org:'Irbis Solutions', segment:'Associé unique', conn:['r0'] },
  { id:'c5', name:'Benjamin DURAND', org:'B Durand Capital', segment:'Associé unique', conn:['r0'] },
  { id:'c6', name:'Bernard WEILL', org:'Cecase', segment:'Associé unique', conn:['r0'] },
  { id:'c7', name:'Charles COULOMBAN', org:'B-Investissement', segment:'New Gen CGP', conn:['r0'] },
  { id:'c8', name:'David FERRIER', org:'Ferrier Conseils', segment:'Associé unique', conn:['r0'] },
  { id:'c9', name:'Emilie CHARBONNEL', org:'Alytis GP', segment:'Associé unique', conn:['r0'] },
  { id:'c10', name:'Fabien CABEZON', org:'HGP', segment:'Associé unique', conn:['r0'] },
  { id:'c11', name:'Florent BARBIER', org:'Patrimoine Pierre & Fin.', segment:'New Gen CGP', conn:['r0'] },
  { id:'c12', name:'François MAZET', org:'MV Partenaires', segment:'New Gen CGP', conn:['r0'] },
  { id:'c13', name:'F.-X. Lenier', org:'Facteur 7', segment:'Jeune en croissance CNCGP - Portable', conn:['r0'] },
  { id:'c14', name:'Malcolm VINCENT', org:'Parisii GP', segment:'New Gen CGP', conn:['r0'] },
  { id:'c15', name:'Marianne NAVARRE', org:'M. Navarre Conseil', segment:'Associé unique', conn:['r0'] },
  { id:'c16', name:'Marion CHAPEL-MASSOT', org:'Decarion Office', segment:'Associé unique', conn:['r0'] },
  { id:'c17', name:'Matthieu PAQUIER', org:'Orkestra Partners', segment:'Associé unique', conn:['r0'] },
  { id:'c18', name:'Nicolas STOCLET', org:'Opaline Patrimoine', segment:'Associé unique', conn:['r0'] },
  { id:'c19', name:'Ninon MANARANCHE-M.', org:'Amanthee Patrimoine', segment:'New Gen CGP', conn:['r0'] },
  { id:'c20', name:'Olivier VASSEUR', org:'LDV Patrimoine', segment:'Associé unique', conn:['r0'] },
  { id:'c21', name:'Pascal BADIER', org:'Milestone Financement', segment:'New Gen CGP', conn:['r0'] },
  { id:'c22', name:'Pascal MARTIN', org:'IFIP', segment:'Associé unique', conn:['r0'] },
  { id:'c23', name:'Romain ELMOSNINO', org:'Vested GP', segment:'New Gen CGP', conn:['r0'] },
  { id:'c24', name:'Ruben AOUIZERATE', org:'Beyond Wealth', segment:'Associé unique', conn:['r0'] },
  { id:'c25', name:'S.-J. Galadima', org:'Sapians', segment:'Jeune en croissance CNCGP - Portable', conn:['r0'] },
  { id:'c26', name:'Stéphane CARLUCCI', org:'Petram F.O.', segment:'Associé unique', conn:['r0'] },
  { id:'c27', name:'Yoann RICHARD', org:'Eurassur', segment:'Associé unique', conn:['r0'] },
  { id:'c28', name:'Ethel MOLINA', org:'Ma Gestion Privée', segment:'Associé unique', conn:['r2'] },
  { id:'c29', name:'Mathieu SANLAVILLE', org:'Norma Conseils', segment:'New Gen CGP', conn:['r2'] },
  { id:'c30', name:'Simon LOLMEDE', org:'Origami 31', segment:'New Gen CGP', conn:['r2'] },
  { id:'c31', name:'Stéphane VAN HUFFEL', org:'SVH Conseils', segment:'Associé unique', conn:['r2'] },
  { id:'c32', name:'Tathy DIALLO', org:'Opes Patrimoine', segment:'Associé unique', conn:['r2'] },
  { id:'c33', name:'F.-X. SOEUR', org:'Terrae Patrimoine', segment:'New Gen CGP', conn:['r1'] },
  { id:'c34', name:'Loïc GACH', org:'Outmatch Invest', segment:'New Gen CGP', conn:['r1'] },
  { id:'c35', name:'Matthieu MANCUSO', org:'Egeo Conseil', segment:'Associé unique', conn:['r1'] },
  { id:'c36', name:'Yann LE HER', org:'23IS', segment:'Associé unique', conn:['r1'] },
  { id:'c37', name:'Jülide NINEK', org:'JLDN Conseils', segment:'Associé unique', conn:['r3'] },
];

// Build nodes & edges
const nodes = [];
const edges = [];
const idMap = {};

ROCKFI.forEach((r,i) => {
  const n = { ...r, x:0, y:0, vx:0, vy:0, radius:22, mass:8 };
  idMap[r.id] = nodes.length;
  nodes.push(n);
});

const segColor = {
  'Associé unique': '#34d399',
  'New Gen CGP': '#fb923c',
  'Jeune en croissance CNCGP - Portable': '#60a5fa',
};

CGPS.forEach(c => {
  const n = {
    ...c, type:'cgp', x:0, y:0, vx:0, vy:0,
    radius: c.conn.length > 1 ? 7 : 5,
    mass: c.conn.length > 1 ? 2 : 1,
    color: segColor[c.segment] || '#34d399',
    multi: c.conn.length > 1,
  };
  idMap[c.id] = nodes.length;
  nodes.push(n);
  c.conn.forEach(rid => {
    edges.push({ source: idMap[c.id] || nodes.length-1, target: idMap[rid], multi: c.conn.length > 1 });
  });
});

// Fix: re-assign source indices properly
let ei = 0;
CGPS.forEach(c => {
  const si = idMap[c.id];
  c.conn.forEach(rid => {
    edges[ei].source = si;
    edges[ei].target = idMap[rid];
    ei++;
  });
});

// Initial positions — Rockfi in center area, CGPs scattered
const W = window.innerWidth, H = window.innerHeight;
const cx = W/2, cy = H/2;

// Place Rockfi nodes in a diamond
const rPositions = [
  { x: cx, y: cy - 80 },     // Leleu top
  { x: cx + 100, y: cy + 20 }, // Olric right
  { x: cx - 100, y: cy + 20 }, // Sahirah left
  { x: cx, y: cy + 100 },    // Marie bottom
];
ROCKFI.forEach((r, i) => {
  const ni = idMap[r.id];
  nodes[ni].x = rPositions[i].x;
  nodes[ni].y = rPositions[i].y;
  nodes[ni].fx = null;
  nodes[ni].fy = null;
});

// Scatter CGPs around their connected Rockfi person
CGPS.forEach(c => {
  const ni = idMap[c.id];
  const primaryRockfi = idMap[c.conn[0]];
  const angle = Math.random() * Math.PI * 2;
  const dist = 120 + Math.random() * 200;
  nodes[ni].x = nodes[primaryRockfi].x + Math.cos(angle) * dist;
  nodes[ni].y = nodes[primaryRockfi].y + Math.sin(angle) * dist;
});

// Physics simulation
let activeFilter = 'all';
let alpha = 1;
let dragging = null;
let hovering = null;
let panX = 0, panY = 0, zoom = 1;
let panStart = null;

function isVisible(node) {
  if (node.type === 'rockfi') return true;
  if (activeFilter === 'all') return true;
  const rockfiId = ROCKFI.find(r => r.name === activeFilter)?.id;
  if (!rockfiId) return true;
  return node.conn && node.conn.includes(rockfiId);
}

function simulate() {
  const dt = 0.3;
  const repulsion = 800;
  const attraction = 0.008;
  const restLength = 160;
  const damping = 0.88;
  const centerPull = 0.0003;

  // Only simulate visible nodes
  const visibleSet = new Set();
  nodes.forEach((n, i) => { if (isVisible(n)) visibleSet.add(i); });

  // Repulsion between all visible nodes
  const visArr = [...visibleSet];
  for (let a = 0; a < visArr.length; a++) {
    for (let b = a+1; b < visArr.length; b++) {
      const na = nodes[visArr[a]], nb = nodes[visArr[b]];
      let dx = nb.x - na.x, dy = nb.y - na.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) d2 = 1;
      const d = Math.sqrt(d2);
      const f = repulsion / d2;
      const fx = (dx/d)*f, fy = (dy/d)*f;
      na.vx -= fx/na.mass; na.vy -= fy/na.mass;
      nb.vx += fx/nb.mass; nb.vy += fy/nb.mass;
    }
  }

  // Attraction along edges
  edges.forEach(e => {
    if (!visibleSet.has(e.source) || !visibleSet.has(e.target)) return;
    const na = nodes[e.source], nb = nodes[e.target];
    let dx = nb.x - na.x, dy = nb.y - na.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = (d - restLength) * attraction;
    const fx = (dx/d)*f, fy = (dy/d)*f;
    na.vx += fx; na.vy += fy;
    nb.vx -= fx; nb.vy -= fy;
  });

  // Center pull
  nodes.forEach((n,i) => {
    if (!visibleSet.has(i)) return;
    n.vx += (cx - n.x) * centerPull;
    n.vy += (cy - n.y) * centerPull;
  });

  // Integrate
  nodes.forEach((n,i) => {
    if (!visibleSet.has(i) || n === dragging) return;
    n.vx *= damping * alpha;
    n.vy *= damping * alpha;
    n.x += n.vx * dt;
    n.y += n.vy * dt;
  });

  alpha *= 0.998;
  if (alpha < 0.01) alpha = 0.01;
}

// Rendering
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let dpr = window.devicePixelRatio || 1;

function resize() {
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

function toScreen(x, y) {
  return [(x + panX) * zoom + W/2*(1-zoom), (y + panY) * zoom + H/2*(1-zoom)];
}
function toWorld(sx, sy) {
  return [(sx - W/2*(1-zoom))/zoom - panX, (sy - H/2*(1-zoom))/zoom - panY];
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2*(1-zoom) + panX*zoom, H/2*(1-zoom) + panY*zoom);
  ctx.scale(zoom, zoom);

  const visibleSet = new Set();
  nodes.forEach((n, i) => { if (isVisible(n)) visibleSet.add(i); });

  // Glow behind Rockfi nodes
  nodes.forEach((n, i) => {
    if (n.type !== 'rockfi' || !visibleSet.has(i)) return;
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 80);
    grad.addColorStop(0, 'rgba(167,139,250,0.08)');
    grad.addColorStop(1, 'rgba(167,139,250,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 80, 0, Math.PI*2);
    ctx.fill();
  });

  // Edges
  edges.forEach(e => {
    if (!visibleSet.has(e.source) || !visibleSet.has(e.target)) return;
    const na = nodes[e.source], nb = nodes[e.target];
    const isHovered = hovering !== null && (e.source === hovering || e.target === hovering);

    ctx.beginPath();
    ctx.moveTo(na.x, na.y);
    ctx.lineTo(nb.x, nb.y);

    if (e.multi) {
      ctx.strokeStyle = isHovered ? 'rgba(251,191,36,0.7)' : 'rgba(251,191,36,0.3)';
      ctx.lineWidth = isHovered ? 2 : 1.2;
    } else {
      const col = na.type === 'cgp' ? na.color : nb.color;
      const a = isHovered ? 0.6 : 0.12;
      ctx.strokeStyle = col.replace(')', `,${a})`).replace('rgb', 'rgba');
      if (col.startsWith('#')) {
        const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
        ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
      }
      ctx.lineWidth = isHovered ? 1.5 : 0.6;
    }
    ctx.stroke();
  });

  // Nodes
  nodes.forEach((n, i) => {
    if (!visibleSet.has(i)) return;
    const isHov = i === hovering;

    if (n.type === 'rockfi') {
      // Rockfi node
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + (isHov ? 3 : 0), 0, Math.PI*2);
      ctx.fillStyle = isHov ? '#a78bfa' : '#7c3aed';
      ctx.fill();
      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.font = '500 12px "IBM Plex Sans"';
      ctx.fillStyle = '#e8e8f0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.short, n.x, n.y);
    } else {
      // CGP node
      const r = n.radius + (isHov ? 2 : 0);
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.fillStyle = isHov ? n.color : n.color + '99';
      ctx.fill();

      if (n.multi) {
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Label on hover
      if (isHov) {
        ctx.font = '500 10px "IBM Plex Sans"';
        ctx.fillStyle = '#e8e8f0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(n.name, n.x, n.y - r - 4);
      }
    }
  });

  ctx.restore();
}

function frame() {
  simulate();
  draw();
  requestAnimationFrame(frame);
}
frame();

// Interaction
function getNodeAt(mx, my) {
  const [wx, wy] = toWorld(mx, my);
  let best = null, bestD = Infinity;
  nodes.forEach((n, i) => {
    if (!isVisible(n)) return;
    const dx = wx - n.x, dy = wy - n.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    const hitR = n.radius + 8;
    if (d < hitR && d < bestD) { best = i; bestD = d; }
  });
  return best;
}

canvas.addEventListener('mousemove', e => {
  const mx = e.clientX, my = e.clientY;

  if (dragging !== null) {
    const [wx, wy] = toWorld(mx, my);
    nodes[dragging].x = wx;
    nodes[dragging].y = wy;
    nodes[dragging].vx = 0;
    nodes[dragging].vy = 0;
    alpha = 0.3;
    return;
  }

  if (panStart) {
    panX += (mx - panStart.x) / zoom;
    panY += (my - panStart.y) / zoom;
    panStart = { x: mx, y: my };
    return;
  }

  const idx = getNodeAt(mx, my);
  hovering = idx;
  canvas.style.cursor = idx !== null ? 'pointer' : 'grab';

  if (idx !== null) {
    const n = nodes[idx];
    let html = '<div class="tt-name">' + (n.name || n.short) + '</div>';
    if (n.type === 'cgp') {
      html += '<div class="tt-org">' + n.org + '</div>';
      html += '<div class="tt-segment">' + n.segment + '</div>';
      const connNames = n.conn.map(rid => ROCKFI.find(r=>r.id===rid)?.short).join(', ');
      html += '<div class="tt-conn">→ ' + connNames + '</div>';
      if (n.multi) html += '<div style="color:#fbbf24;font-size:10px;margin-top:2px">★ Multi-connected</div>';
    } else {
      const count = CGPS.filter(c => c.conn.includes(n.id)).length;
      html += '<div class="tt-org">' + count + ' CGPs connectés</div>';
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (mx + 16) + 'px';
    tooltip.style.top = (my - 10) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mousedown', e => {
  const idx = getNodeAt(e.clientX, e.clientY);
  if (idx !== null) {
    dragging = idx;
    alpha = 0.5;
    canvas.style.cursor = 'grabbing';
  } else {
    panStart = { x: e.clientX, y: e.clientY };
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mouseup', () => {
  dragging = null;
  panStart = null;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.max(0.3, Math.min(4, zoom * factor));
}, { passive: false });

// Filter
function setFilter(f) {
  activeFilter = f;
  alpha = 0.8;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  event.target.closest('.fbtn').classList.add('active');
}

// Touch support
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const idx = getNodeAt(t.clientX, t.clientY);
    if (idx !== null) dragging = idx;
    else panStart = { x: t.clientX, y: t.clientY };
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    if (dragging !== null) {
      const [wx, wy] = toWorld(t.clientX, t.clientY);
      nodes[dragging].x = wx; nodes[dragging].y = wy;
      nodes[dragging].vx = 0; nodes[dragging].vy = 0;
      alpha = 0.3;
    } else if (panStart) {
      panX += (t.clientX - panStart.x) / zoom;
      panY += (t.clientY - panStart.y) / zoom;
      panStart = { x: t.clientX, y: t.clientY };
    }
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = null; panStart = null; });
</script>
</body>
</html>
